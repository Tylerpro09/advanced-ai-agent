<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Advanced AI Agent</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff}.app{max-width:980px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{padding:16px;border-bottom:1px solid #26304a;position:sticky;top:0;z-index:5;background:#0b1020e8;backdrop-filter:blur(12px)}.top b{font-size:20px}.top small{display:block;color:#9ca3af;margin-top:3px}.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}.m{padding:12px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap;line-height:1.45}.u{align-self:flex-end;background:#2563eb}.a{align-self:flex-start;background:#1f2937}.bar{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;position:sticky;bottom:0;background:#0b1020;border-top:1px solid #26304a}textarea{resize:none;min-height:52px;max-height:180px;border:1px solid #374151;border-radius:14px;background:#111827;color:white;padding:13px;font:inherit}button{border:0;border-radius:12px;padding:9px 13px;background:#303a52;color:white;font-weight:650;cursor:pointer}button:hover{filter:brightness(1.14)}.send{background:#4f46e5;padding:0 18px}.tools{display:flex;gap:7px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid #1f2937}.tools button{font-size:13px}.status{font-size:12px;color:#9ca3af;padding:0 16px 8px}.feedback{display:flex;gap:3px;margin-top:7px;opacity:.58;transition:opacity .15s}.m.a:hover .feedback,.feedback:focus-within{opacity:1}.feedback button{width:30px;height:27px;padding:0;border-radius:9px;background:transparent;color:#aab2c0;font-size:14px;font-weight:400}.feedback button:hover{background:#374151;color:#fff}.feedback .rated{padding:2px 6px;color:#9ca3af;font-size:11px}.hidden{display:none}.panel{font-size:13px}.panel b{color:#c7d2fe}.bad{color:#fca5a5}.good{color:#86efac}@media(max-width:600px){.m{max-width:96%}.tools{overflow-x:auto;flex-wrap:nowrap}.tools button{white-space:nowrap}.top small{font-size:11px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><b>Advanced AI Agent <span style="font-size:12px;color:#9ca3af">v2.9</span></b><small>Memoria · aprendizaje · LM Studio · herramientas &nbsp; <button id="tokenBtn" style="padding:3px 7px;font-size:11px">🔐 Token</button></small></header>
  <div class="tools">
    <button id="brain">🧠 Cerebro</button><button id="goals">🎯 Metas</button><button id="memories">💾 Recuerdos</button><button id="model">🔌 Modelo</button><button id="consolidate">🔄 Consolidar</button><button id="newChat">🆕 Chat</button><button id="voice">🎙️ Voz</button><button id="image">🖼️ Visión</button><button id="doc">📚 Documento</button><button id="trainLora">🧬 LoRA</button>
    <input id="audioFile" class="hidden" type="file" accept="audio/*"/><input id="imageFile" class="hidden" type="file" accept="image/*"/><input id="docFile" class="hidden" type="file" accept=".txt,.md,.json,.csv,.pdf,.py,.js,.html,.yaml,.yml,.toml,.ini,.log"/>
  </div>
  <section id="msgs" class="msgs"><div class="m a">Hey 👋</div></section>
  <div id="status" class="status"></div>
  <form id="form" class="bar"><textarea id="q" placeholder="Escribe un mensaje…"></textarea><button class="send">Enviar</button></form>
</main>
<script>
const userId=localStorage.userId||(localStorage.userId=crypto.randomUUID()), conv='main';
let apiToken=localStorage.apiToken||'';
const authHeaders=()=>apiToken?{'authorization':'Bearer '+apiToken}:{};
const msgs=document.querySelector('#msgs'),q=document.querySelector('#q'),statusEl=document.querySelector('#status');
document.querySelector('#tokenBtn').onclick=()=>{const t=prompt('API_TOKEN del servidor (vacío para quitarlo):',apiToken)||'';apiToken=t.trim();localStorage.apiToken=apiToken};
function add(text,who='a'){const d=document.createElement('div');d.className='m '+who;d.textContent=text;msgs.appendChild(d);scrollTo(0,document.body.scrollHeight);return d}
function errText(j,status){return (j&&j.detail)||`Error HTTP ${status}`}
async function getJson(url,opts={}){const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),...authHeaders()}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(errText(j,r.status));return j}
async function rateExperience(id,reward,box){if(!id)return;let reason='';if(reward<0)reason=(prompt('¿Qué estuvo mal? Esto ayuda a que aprenda mejor. (opcional)')||'').trim();const lesson=reward>0?'Reforzar el enfoque, tono y decisiones que funcionaron en esta situación.':('No repetir este enfoque.'+(reason?' Motivo del usuario: '+reason:''));const outcome=reward>0?'La respuesta encajó bien':'La respuesta no encajó bien';const buttons=[...box.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await getJson('/v1/experiences/'+id+'/feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user_id:userId,reward,outcome,lesson})});box.innerHTML=`<span class="rated">${reward>0?'👍 aprendido':'👎 aprendido'}</span>`}catch(e){buttons.forEach(b=>b.disabled=false);box.innerHTML='<span class="rated bad">⚠ '+e.message+'</span>'}}
async function teachCorrection(id,box){const corrected=(prompt('Escribe la respuesta que debería haber dado:')||'').trim();if(!corrected)return;const reason=(prompt('¿Qué debería aprender de esta corrección? (opcional)')||'').trim();try{const j=await getJson('/v1/experiences/'+id+'/correction',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user_id:userId,corrected_answer:corrected,reason})});box.innerHTML='<span class="rated good">✓ corrección aprendida</span>';add('Entendido. Guardé tu corrección como ejemplo fuerte de aprendizaje.','a')}catch(e){add('No pude guardar la corrección: '+e.message,'a')}}
function addAssistant(text,experienceId){const d=add(text,'a');if(experienceId){const f=document.createElement('div');f.className='feedback';const up=document.createElement('button'),down=document.createElement('button'),fix=document.createElement('button');up.type=down.type=fix.type='button';up.textContent='👍';down.textContent='👎';fix.textContent='✏️';up.title='Me gustó';down.title='No me gustó';fix.title='Enseñar respuesta correcta';up.onclick=()=>rateExperience(experienceId,1,f);down.onclick=()=>rateExperience(experienceId,-1,f);fix.onclick=()=>teachCorrection(experienceId,f);f.append(up,down,fix);d.appendChild(f)}return d}
async function chat(text){add(text,'u');statusEl.textContent='Pensando…';try{const j=await getJson('/v1/agent/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user_id:userId,conversation_id:conv,message:text})});addAssistant(j.answer||'Sin respuesta',j.experience_id);statusEl.textContent=j.tool_rounds?`Herramientas: ${j.tool_rounds}`:''}catch(e){add('Error: '+e.message,'a');statusEl.textContent=''}}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();const t=q.value.trim();if(t){q.value='';chat(t)}};q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#form').requestSubmit()}};
function picker(button,input){document.querySelector(button).onclick=()=>document.querySelector(input).click()}picker('#voice','#audioFile');picker('#image','#imageFile');picker('#doc','#docFile');

document.querySelector('#brain').onclick=async()=>{statusEl.textContent='Leyendo cerebro…';try{const j=await getJson('/v1/brain/dashboard?user_id='+encodeURIComponent(userId));const e=j.experiences||{},p=j.policy||{},d=j.developmental?.profile||{},h=j.human||{};add(`🧠 Cerebro v${j.version}\n\nExperiencias: ${e.experiences||0} · evaluadas: ${e.rated||0}\nRed de experiencia: ${p.trained?'entrenada':'aún aprendiendo'} · muestras: ${p.samples||0}\nEtapa: ${d.stage||'seed'} · XP: ${Number(d.xp||0).toFixed(1)} · metas abiertas: ${d.open_goals||0}\nMemorias cognitivas: ${h.total_memories??h.memories??0}\nModelo: ${j.model?.resolved_model||j.model?.configured_model||j.model?.model||'auto'}`,'a')}catch(e){add('No pude abrir el cerebro: '+e.message,'a')}statusEl.textContent=''};
document.querySelector('#goals').onclick=async()=>{try{const j=await getJson('/v1/development/goals?user_id='+encodeURIComponent(userId)+'&status=open&limit=20');const items=j.items||[];add(items.length?'🎯 Metas de aprendizaje\n\n'+items.map(x=>`• ${x.title}\n  confianza ${Math.round((x.confidence||0)*100)}% · éxitos ${x.successes||0}/${x.attempts||0}`).join('\n'):'No hay metas de aprendizaje abiertas.','a')}catch(e){add('Error leyendo metas: '+e.message,'a')}};
document.querySelector('#memories').onclick=async()=>{try{const j=await getJson('/v1/memory?user_id='+encodeURIComponent(userId)+'&limit=15');const items=j.items||[];add(items.length?'💾 Recuerdos recientes\n\n'+items.map(x=>`• [${x.kind}] ${x.text}`).join('\n'):'Todavía no tengo recuerdos duraderos guardados.','a')}catch(e){add('Error leyendo recuerdos: '+e.message,'a')}};
document.querySelector('#model').onclick=async()=>{try{const j=await getJson('/v1/model/status');add('🔌 Modelo\n\n'+JSON.stringify(j,null,2),'a')}catch(e){add('Error leyendo modelo: '+e.message,'a')}};
document.querySelector('#consolidate').onclick=async()=>{statusEl.textContent='Consolidando aprendizaje…';try{const j=await getJson('/v1/brain/consolidate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user_id:userId})});add(`🔄 Aprendizaje consolidado\nExperiencias evaluadas: ${j.experience_stats?.rated||0}\nEjemplos exportados: ${j.exported_examples||0}\nRed: ${j.policy?.trained?'entrenada':'aún necesita más feedback'}`,'a')}catch(e){add('No pude consolidar: '+e.message,'a')}statusEl.textContent=''};
document.querySelector('#newChat').onclick=async()=>{if(!confirm('¿Empezar conversación nueva? La memoria de largo plazo no se borra.'))return;try{await getJson('/v1/conversations/'+encodeURIComponent(conv)+'/clear',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user_id:userId})});msgs.innerHTML='';add('Nueva conversación. Sigo teniendo la memoria de largo plazo que hayas enseñado.','a')}catch(e){add('No pude limpiar la conversación: '+e.message,'a')}};
document.querySelector('#trainLora').onclick=async()=>{if(!confirm('Entrenar LoRA puede usar bastante RAM/VRAM. ¿Continuar?'))return;statusEl.textContent='Entrenando LoRA…';try{const j=await getJson('/v1/learning/lora/train',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user_id:userId,activate:true})});add(`LoRA creado: ${j.adapter?.id||'nuevo'} · ejemplos: ${j.adapter?.examples||0}`,'a')}catch(e){add('LoRA: '+e.message,'a')}statusEl.textContent=''};
document.querySelector('#audioFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;statusEl.textContent='Transcribiendo…';const fd=new FormData();fd.append('file',f);try{const j=await getJson('/v1/audio/transcribe',{method:'POST',body:fd});q.value=j.text||''}catch(e2){add('Audio: '+e2.message,'a')}statusEl.textContent=''};
document.querySelector('#imageFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;statusEl.textContent='Analizando imagen…';const fd=new FormData();fd.append('file',f);fd.append('prompt','Analiza esta imagen y responde en español.');try{const j=await getJson('/v1/vision/analyze',{method:'POST',body:fd});add(j.answer||j.detail||'Sin respuesta','a')}catch(e2){add('Visión: '+e2.message,'a')}statusEl.textContent=''};
document.querySelector('#docFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;statusEl.textContent='Indexando documento…';const fd=new FormData();fd.append('user_id',userId);fd.append('file',f);try{const j=await getJson('/v1/knowledge/upload',{method:'POST',body:fd});statusEl.textContent=`Documento indexado: ${j.chunks||0} fragmentos`}catch(e2){statusEl.textContent='Error: '+e2.message}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
