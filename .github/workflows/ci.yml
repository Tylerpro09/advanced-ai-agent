name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q app connectors plugins *.py
      - name: Core smoke tests
        run: |
          python test_smoke.py
          python test_neural_memory.py
          python test_experience_memory.py
          python test_learning_system.py
          python test_human_learning.py
          python test_developmental_learning.py
          python test_v271_hardening.py
          python test_v281_feedback.py
          python test_lmstudio_provider.py
          python test_conversational_presence.py
          python test_embedded_model.py
          python test_hardening.py
          python test_api.py
      - name: Configuration diagnostics
        run: python doctor.py
